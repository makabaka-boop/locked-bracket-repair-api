services:
  api:
    build: .
    image: macro-repair-api
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5
    restart: unless-stopped
